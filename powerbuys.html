<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wolfpak Power Buys</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ink:#121110; --paper:#F6F3EC; --card:#FFFFFF; --line:#DDD7CC; --mute:#6E6860;
  --red:#C8102E; --red-ink:#FFFFFF; --deal:#FBE9EC; --photo:#FFFFFF;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#F1ECE3; --paper:#121110; --card:#1C1A18; --line:#332F2A; --mute:#A39C91;
  --red:#E3213F; --red-ink:#FFFFFF; --deal:#2A1519; --photo:#F1ECE3;
}}
:root[data-theme="dark"]{
  --ink:#F1ECE3; --paper:#121110; --card:#1C1A18; --line:#332F2A; --mute:#A39C91;
  --red:#E3213F; --red-ink:#FFFFFF; --deal:#2A1519; --photo:#F1ECE3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:"Archivo","Arial Narrow",sans-serif;font-variation-settings:"wdth" 90;letter-spacing:-.01em;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 48px}
header{background:#0B0B0B;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand{font-family:"Archivo";font-weight:800;font-variation-settings:"wdth" 88;letter-spacing:.14em;font-size:15px;text-transform:uppercase;color:#fff;text-decoration:none}
header .brand small{display:block;font-weight:400;letter-spacing:.22em;font-size:9px;opacity:.7}
.badge{background:var(--red);color:var(--red-ink);font-family:"Archivo";font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:3px;white-space:nowrap}
.eyebrow{font-family:"Archivo";font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.photo{aspect-ratio:1;max-height:340px;margin:18px auto 14px;background:var(--photo);border-radius:8px;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo .tag{position:absolute;top:12px;left:12px}
h1{font-size:32px;line-height:1.05;font-weight:800}
.sub{color:var(--mute);margin:6px 0 0}
.deal{margin:20px 0;background:var(--deal);border-left:4px solid var(--red);border-radius:0 6px 6px 0;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end}
.deal .now{font-family:"Archivo";font-weight:800;font-size:38px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.deal .now span{font-size:15px;font-weight:600;color:var(--ink)}
.deal .per{text-align:right;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.deal .per b{display:block;color:var(--ink);font-size:17px}
.deal .terms{grid-column:1/-1;font-size:14px;color:var(--mute)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:18px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
.specs div b{display:block;font-family:"Archivo";font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:2px}
.heat{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.heat i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.heat i.on{background:var(--red)}
p{margin:0 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:5px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-family:"Archivo";font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.wa{background:#25D366;border-color:#25D366;color:#0b0b0b}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.form{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 18px}
.form h2{font-size:24px;font-weight:800;margin-bottom:4px}
.form .hint{color:var(--mute);font-size:15px;margin-bottom:16px}
label{display:block;font-family:"Archivo";font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit;font-size:17px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
.qty{display:grid;grid-template-columns:auto 1fr auto;border:1.5px solid var(--line);border-radius:5px;overflow:hidden;background:var(--paper)}
.qty button{border:0;background:transparent;color:var(--ink);font-size:24px;width:52px;cursor:pointer}
.qty input{border:0;text-align:center;font-family:"Archivo";font-weight:700;font-size:22px;background:transparent}
.units{font-size:14px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.total b{font-family:"Archivo";font-size:26px;font-variant-numeric:tabular-nums}
.total small{color:var(--mute);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:grid;gap:12px;margin-top:20px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-decoration:none;color:inherit}
.item .th{aspect-ratio:1;background:var(--photo);border-radius:5px;overflow:hidden}
.item .th img{width:100%;height:100%;object-fit:contain;display:block}
.item h3{font-size:17px;font-weight:800;line-height:1.15}
.item .p{color:var(--red);font-family:"Archivo";font-weight:800;font-size:18px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.item .m{color:var(--mute);font-size:13px}
.foot{margin-top:36px;color:var(--mute);font-size:14px;text-align:center}
.foot a{color:inherit}
.err{color:var(--red);font-size:14px;margin-top:10px;display:none}
.btn:disabled{opacity:.6;cursor:default}
.done h2{color:var(--red)}
</style>
</head>

function route(){
  const id = location.hash.replace(/^#\/?/, "");
  const p = PRODUCTS.find(x => x.id === id);
  $("#app").innerHTML = p ? productView(p) : catalogView();
  if (p) wireForm(p);
  window.scrollTo(0,0);
}

          <div class="th"><img src="${p.photo}" alt=""></div>

          <div class="p">${money(p.price)}<div class="m" style="font-weight:400">per case</div></div>
        </a>`).join("")}
    </div>
    <div class="foot">Questions? <a href="mailto:${CONTACT.email}">${CONTACT.email}</a></div>`;
}

  return `
    <div class="photo"><img src="${p.photo}" alt="${esc(p.name)}">${p.badge ? `<span class="badge tag">${esc(p.badge)}</span>` : ""}</div>

    <div class="deal">

      <div class="per">${money(unitCost)} per unit<b>MSRP ${money(p.msrp)}</b></div>
      <div class="terms">Valid for orders placed by ${esc(CONTACT.validUntil)}. Minimum ${CONTACT.minCases} cases, mix and match across items. ${esc(CONTACT.incoterm)}.</div>

      <div><b>Case pack</b>${p.pack} units</div>
      <div><b>Heat</b>${esc(p.heat)} ${heatDots(p.heat)}</div>
      <div><b>UPC</b>${esc(p.upc)}</div>
    </div>

    <p>${esc(p.desc)}</p>

    <a class="btn" href="${esc(p.sell)}" target="_blank" rel="noopener">⬇ Download sell sheet (PDF)</a>

    <form class="form" id="order" method="POST" action="https://formspree.io/f/mbdzopnj">
      <input type="hidden" name="_subject" value="Power buy order – ${esc(p.name)}">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="product" value="${esc(p.name)} (${esc(p.size)}, case of ${p.pack})">
      <input type="hidden" name="upc" value="${esc(p.upc)}">
      <input type="hidden" name="case_price" value="${money(p.price)}">
      <input type="hidden" name="estimated_total" id="totalField" value="">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <h2>Place your order</h2>
      <div class="hint">We confirm availability and freight to your island within 24 hours.</div>

      <label for="qty">Cases</label>
      <div class="qty">
        <button type="button" data-d="-1" aria-label="Less">−</button>
        <input id="qty" name="cases" type="number" inputmode="numeric" min="1" step="1" value="${CONTACT.minCases}" required>
        <button type="button" data-d="1" aria-label="More">+</button>
      </div>
      <div class="units" id="units"></div>

      <div class="row2">
        <div><label for="company">Company</label><input id="company" name="company" autocomplete="organization" required></div>
        <div><label for="country">Country / island</label><input id="country" name="country" autocomplete="country-name" required></div>
      </div>
      <div class="row2">
        <div><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
        <div><label for="phone">Phone / WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
      </div>
      <label for="email">Email</label><input id="email" name="_replyto" type="email" autocomplete="email" required>
      <label for="notes">Notes (other items, delivery port, consolidator)</label><textarea id="notes" name="notes" rows="2"></textarea>

      <div class="total"><small>Estimated total at show price</small><b id="total"></b></div>
      <div class="err" id="err">Something went wrong sending the order. Please try again or email ${esc(CONTACT.email)}.</div>

      <button class="btn primary" type="submit" id="sendBtn">Send order</button>
      <div class="hint" style="margin:12px 0 0">Questions? <a href="mailto:${CONTACT.email}" style="color:inherit">${CONTACT.email}</a></div>
    </form>
    <div class="form done" id="done" hidden>
      <h2>Order received</h2>
      <p id="doneText"></p>
      <p class="hint">A copy has gone to the Wolfpak team. We will confirm availability and freight within 24 hours at the email you gave us.</p>
    </div>

    <div class="foot"><a href="#/">← All Seed Ranch power buys</a></div>`;
}

function wireForm(p){
  const qty = $("#qty"), total = $("#total"), units = $("#units");
  const q = () => Math.max(1, parseInt(qty.value) || 1);
  const upd = () => { total.textContent = money(q() * p.price); units.textContent = `${q() * p.pack} units · ${q()} case${q()>1?"s":""}`; };
  qty.addEventListener("input", upd);
  document.querySelectorAll(".qty button").forEach(b => b.addEventListener("click", () => { qty.value = Math.max(1, q() + parseInt(b.dataset.d)); upd(); }));
  upd();

  const form = $("#order");
  const syncTotal = () => { $("#totalField").value = money(q() * p.price) + " " + CONTACT.incoterm; };
  qty.addEventListener("input", syncTotal);
  document.querySelectorAll(".qty button").forEach(b => b.addEventListener("click", syncTotal));
  syncTotal();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = "Sending…"; $("#err").style.display = "none";
    try {
      const res = await fetch(form.action, { method: "POST", headers: { "Accept": "application/json" }, body: new FormData(form) });
      if (!res.ok) throw new Error(res.status);
      $("#doneText").textContent = `${q()} case${q()>1?"s":""} of ${p.name} at ${money(p.price)} per case, estimated ${money(q()*p.price)} ${CONTACT.incoterm}.`;
      form.hidden = true; $("#done").hidden = false; window.scrollTo(0, 0);
    } catch (err) {
      $("#err").style.display = "block"; btn.disabled = false; btn.textContent = "Send order";
    }
  });
}

window.addEventListener("hashchange", route);
route();
</script>
